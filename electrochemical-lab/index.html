<div id="tab-model" class="tab-content" hidden><div class="model-grid"><article><div class="eyebrow">01 / ELECTROCHEMISTRY</div><h3>一个反应进度 ξ</h3><p>Zn 消耗、Zn²⁺ 增加、Cu²⁺ 消耗和 Cu 沉积的摩尔量均等于 ξ。ξ̇ = I / (2F)，转移电子物质的量为 2ξ。浓度按固定体积 0.10 L 换算。初始锌 0.15 mol，铜 0.10 mol。</p><code>Q = (cZn / c°) / (cCu / c°)；c° = 1 mol/L</code><p>恒温 298.15 K，均匀混合、体积不变，纯金属活度为 1。以浓度代替活度是理想溶液近似；真实 1 mol/L 电解质有显著非理想性，本软件不代表精密实验预测。</p></article><article><div class="eyebrow">02 / CIRCUIT</div><h3>从同一网络求解电流与电压</h3><p>直流准稳态、理想导线、理想开关与测量表；外部只有纯电阻。四项欧姆内阻相加。并联支路各有独立的 I、U 和功率；串联中点按元件压降计算。</p><code>E = U + Ir；U = IR；EI = I²R + I²r</code><p>开路时 I = 0、U = E，电压落在开关断口。暂停冻结演化，但仍显示当前准稳态预测电流。真实损失还含电极动力学与传质极化，本版未计算这些损失。</p></article><article><div class="eyebrow">03 / VISUALIZATION</div><h3>示意与计算分开标注</h3><p>粒子数、晶格间距、移动速度及电极绘图宽度用于抽样说明，不代表真实空间和粒子尺度。界面事件与电子相位仍从 ξ 导出；离子由独立的一维 Nernst–Planck 输出驱动，其播放倍率不回写物理模型。随机热扰动按粒子群均值抽样。默认零浓差放电时，盐桥内 NO₃⁻ 向阳极、K⁺ 向阴极；施加储库浓差后以求解净通量为准。电子只在金属与外电路中出现。</p><p>新增一维、电中性、无对流迁移扩散近似；未求解二维/三维浓度场、泊松方程或完整电双层。详细库存闭合与储库边界见“离子与场”。电化学势包含化学势与电势能项；电动势是单位电荷的可用化学功，不能直接当作内部空间静电势分布。</p></article><article><div class="eyebrow">04 / NUMERICAL BOUNDARIES</div><h3>稳定推进，明确停止</h3><p>自适应显式中点积分：单步最多 60 模拟秒，且反应量不超过相关剩余库存的 0.5%。Cu²⁺ 达到 max(10⁻⁶ mol/L, 初始值的 0.01%)，或锌剩余初始量的百万分之一时停止。</p><p>保护边界仅为数值有效域，不是精确的电池寿命或传质极限。高倍率时动画会抽样混叠，以数值与积分结果为准。后台隐藏时自动暂停，恢复后手动继续；不补算离线时间。</p><a href="https://openstax.org/books/chemistry-2e/pages/17-4-potential-free-energy-and-equilibrium" target="_blank" rel="noreferrer">参考：OpenStax · 电势、自由能与能斯特方程 ↗</a></article></div></div>
